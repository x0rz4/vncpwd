name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  # Native Linux build with sanitizers.  This is the fast gate: it finds
  # out-of-bounds reads and undefined behaviour that a Wine run would not
  # necessarily surface, and it does not depend on the cross toolchain.
  #
  # Ubuntu is also the only job that compiles and runs the code as LP64.
  # Developing on Windows means `unsigned long` is 32 bits there, so an
  # LP64-only defect (a 64-bit size_t narrowing, or a UL literal that
  # promotes) passes local builds and fails here.  That is exactly how the
  # des.c literal bug reached CI once.
  test:
    name: test (ubuntu, asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DVNCPWD_SANITIZERS=ON \
            -DVNCPWD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # The shipping artefact: a 64-bit Windows executable cross-compiled on
  # Linux with mingw-w64.  The same CTest definitions are re-run here with
  # Wine as the emulator, so the produced .exe is actually executed rather
  # than merely linked.
  windows:
    name: windows x64 (cross, wine)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 cmake ninja-build wine
          # Some images expose only the suffixed binary; make `wine` resolve
          # so the emulator name in the toolchain file does not depend on
          # which packaging the runner happens to carry.
          if ! command -v wine >/dev/null 2>&1; then
            sudo ln -sf "$(command -v wine64)" /usr/local/bin/wine
          fi
          wine --version

      - name: Configure
        run: |
          cmake -S . -B build-win64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DVNCPWD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-win64 --parallel

      - name: Verify the artefact is a 64-bit PE
        run: |
          file build-win64/vncpwd.exe
          file build-win64/vncpwd.exe | grep -q 'PE32+ executable'
          # No MinGW runtime DLLs may be required: the tool has to run on a
          # bare Windows host.  Only the UCRT API sets, KERNEL32 and ADVAPI32
          # should appear in the import table.
          imports=$(x86_64-w64-mingw32-objdump -p build-win64/vncpwd.exe \
                    | awk '/DLL Name:/ {print $3}')
          echo "Imports:"; echo "$imports"
          if echo "$imports" | grep -qiE 'libgcc|libwinpthread|libstdc'; then
            echo "::error::vncpwd.exe depends on a MinGW runtime DLL"
            exit 1
          fi

      - name: Initialise Wine prefix
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ github.workspace }}/.wine
        run: |
          wineboot --init
          wineserver --wait

      # CTest is not used here.  With a cross build CTest launches the PE file
      # directly, the kernel falls back to /bin/sh, and the result is a shell
      # syntax error that CTest reports as a normal failure -- or, for a
      # WILL_FAIL test, as a pass.  Invoking Wine explicitly keeps the exit
      # status meaningful.  `wine` on a console app returns the program's own
      # exit code, so the assertions below are exact.
      - name: Unit tests under Wine
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ github.workspace }}/.wine
        run: |
          # GitHub runs this step under `bash -e`, so a non-zero exit from
          # Wine would abort before the log is inspected.  Capture the status
          # first, then decide.
          set +e
          wine build-win64/vncpwd_tests.exe > unit.log 2>&1
          status=$?
          set -e
          cat unit.log
          if [ "$status" -ne 0 ]; then
            echo "::error::unit tests exited with $status"
            exit 1
          fi
          grep -q '0 failure(s)' unit.log \
            || { echo '::error::unit test summary missing or non-zero'; exit 1; }

      - name: CLI end-to-end under Wine
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ github.workspace }}/.wine
        run: |
          exe=build-win64/vncpwd.exe
          set +e

          wine "$exe" --version
          [ $? -eq 0 ] || { echo '::error::--version failed'; exit 1; }

          out=$(wine "$exe" inspect --hex dbd83cfd727a1458 --show -q)
          rc=$?
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::inspect exited $rc"; exit 1; }
          echo "$out" | grep -q 'password' \
            || { echo '::error::decoded password not printed'; exit 1; }

          # Malformed hex must be rejected with exit status 2.  Asserting the
          # exact status avoids the WILL_FAIL trap where "could not run" is
          # indistinguishable from "correctly failed".
          wine "$exe" inspect --hex dbd83cfd727a145 -q >/dev/null 2>&1
          rc=$?
          echo "odd-hex exit status: $rc"
          [ $rc -eq 2 ] \
            || { echo "::error::expected exit 2 for malformed hex, got $rc"; exit 1; }

          # A machine-readable audit must produce a report and must not leak
          # secrets by default.  Exit status 0 means "no high-risk findings"
          # and 1 means "high-risk findings present" -- both are successful
          # runs.  Only 2 (usage or I/O error) indicates the tool failed.
          json=$(wine "$exe" audit --json -q)
          rc=$?
          set -e
          echo "$json"
          case $rc in
            0|1) ;;
            *) echo "::error::audit exited $rc (expected 0 or 1)"; exit 1 ;;
          esac
          echo "$json" | grep -q '"max_risk"' \
            || { echo '::error::audit --json produced no report'; exit 1; }
          echo "$json" | grep -q '"secrets_included": false' \
            || { echo '::error::secrets are not redacted by default'; exit 1; }

      - name: Stage artefact
        run: |
          mkdir -p dist
          cp build-win64/vncpwd.exe dist/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum vncpwd.exe > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: vncpwd-windows-x64
          path: dist/
          if-no-files-found: error

  # Tagged releases attach the Windows executable and its checksum.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vncpwd-windows-x64
          path: dist

      - name: Rename for the release
        run: |
          mkdir -p release
          cp dist/vncpwd.exe "release/vncpwd-${GITHUB_REF_NAME}-windows-x64.exe"
          (cd release && sha256sum *.exe > SHA256SUMS.txt)
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
